[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "books"
version = "0.1.0"
description = "Books sample application for software testing training"
requires-python = ">=3.10"
dependencies = [
    "PyYAML>=6.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
books = ["config.yaml"]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-html>=4.1",
]
